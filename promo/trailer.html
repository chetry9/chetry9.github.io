const SI=[['nordvpn','#4687FF','NordVPN'],['expressvpn','#DA3940','ExpressVPN'],['surfshark','#1EBFBF','Surfshark'],['hostinger','#673DE6','Hostinger'],['protonvpn','#6D4AFF','Proton'],['cloudways','#2C39BD','Cloudways']];
let tiles=[];
LIB.forEach(n=>tiles.push(`<img src="assets/logos/lib/${n}.svg">`));
PNG.forEach(n=>tiles.push(`<img src="assets/logos/${n}">`));
SI.forEach(([n,c,t])=>tiles.push(`<div class="si"><div class="mk" style="background:${c};-webkit-mask-image:url(assets/si/${n}.svg)"></div><div class="nm" style="color:${c}">${t}</div></div>`));
// deterministic shuffle
let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
tiles=tiles.map(t=>[rnd(),t]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).slice(0,28);
const COLS=7,ROWS=4,GX=262,GY=154,OX=(1920-COLS*GX+26)/2,OY=(1080-ROWS*GY+26)/2;
// order tiles from centre outwards so the wall grows from the middle
const cells=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)cells.push([c,r,Math.hypot(c-3,(r-1.5)*1.6)+rnd()*.6]);
cells.sort((a,b)=>a[2]-b[2]);
document.getElementById('wall').innerHTML=cells.map(([c,r],i)=>`<div class="tile" id="t${i}" style="left:${OX+c*GX}px;top:${OY+r*GY}px">${tiles[i]}</div>`).join('');
document.getElementById('sparks').innerHTML=Array.from({length:28},(_,i)=>`<div class="spark" id="sp${i}"></div>`).join('');
// mini hero cards
const CARDS=[
 {cat:'WEB HOSTING',logo:'<div class="si"><div class="mk" style="background:#673DE6;-webkit-mask-image:url(assets/si/hostinger.svg)"></div><div class="nm" style="color:#673DE6">HOSTINGER</div></div>',score:9.8,best:'Best overall value hosting'},
 {cat:'AI TOOLS',logo:'<img class="imglogo" src="assets/logos/chatgpt.png" style="height:86px">',score:9.9,best:'Best overall AI assistant'},
 {cat:'VPN',logo:'<div class="si"><div class="mk" style="background:#4687FF;-webkit-mask-image:url(assets/si/nordvpn.svg)"></div><div class="nm" style="color:#1b1f3b">NordVPN</div></div>',score:9.9,best:'Best VPN for privacy'},
 {cat:'E-COMMERCE',logo:'<div class="cust" style="font-size:62px"><img src="assets/logos/lib/shopify.svg" style="height:1.25em"><span style="font-family:PP;font-weight:700;font-style:italic;color:#111">shopify</span></div>',score:9.9,best:'Best all-in-one eCommerce'}];
document.getElementById('cards').innerHTML=CARDS.map((c,k)=>`
 <div class="cattag" id="ctag${k}" style="left:${k%2?120:-40}px;top:${k%2?40:640}px">${c.cat}</div>
 <div class="card mini" id="mc${k}" style="left:640px;top:300px"><div class="rank">#1</div>
  <div class="logoarea" style="height:96px">${c.logo}</div>
  <div class="scorerow"><div class="ring"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="58" stroke="#f1f1f4" stroke-width="12" fill="none"/><circle id="mr${k}" cx="66" cy="66" r="58" stroke="#FF5A14" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="364.4" stroke-dashoffset="364.4"/></svg><div class="v" id="mv${k}">0.0</div></div>
  <div><div class="stars">★★★★★</div><div class="verdict">Outstanding</div></div></div>
  <div class="bestfor">🏆 ${c.best}</div></div>`).join('');
// social pills (same look as main video)
const SOC=[['facebook','#1877F2'],['linkedin','#0A66C2'],['instagram','linear-gradient(45deg,#FEDA75,#FA7E1E 30%,#D62976 60%,#962FBF 85%,#4F5BD5)'],['youtube','#FF0000']];
document.getElementById('social').innerHTML=SOC.map(([n,c],i)=>`<div class="lglass pill" id="pl${i}" style="left:${40+i*466}px"><div class="chip" style="background:${c}"><i style="-webkit-mask-image:url(assets/si/${n}.svg)"></i></div><span>@best<b>digi</b>tools</span></div>`).join('');

gsap.defaults({ease:'power3.out'});
const tl=gsap.timeline({paused:true});
const CUES=[];const cue=(t,y)=>CUES.push([+t.toFixed(3),y]);
const show=(id,t)=>tl.set('#'+id,{opacity:1,visibility:'visible'},t);
const hide=(id,t)=>tl.set('#'+id,{opacity:0,visibility:'hidden'},t);
const flash=(t,o=.9)=>{tl.fromTo('#flash',{opacity:0},{opacity:o,duration:.05,ease:'none',immediateRender:false},t).to('#flash',{opacity:0,duration:.3},t+.05)};
const shake=(sel,t,a=14)=>{for(let i=0;i<6;i++)tl.to(sel,{x:(i%2?-1:1)*a*(1-i/6),y:(i%3-1)*a*.5,duration:.04,ease:'none'},t+i*.04);tl.to(sel,{x:0,y:0,duration:.05},t+.24)};
tl.set('#social .pill',{opacity:0,y:150},0);

/* A: hook 0–5.2 */
show('A',0); cue(0,'boom'); cue(0,'drone'); cue(.3,'vo:0');
[['#a1',.15,1.55],['#a2',1.6,2.95]].forEach(([s,a,b],i)=>{
  tl.fromTo(s,{opacity:0,scale:1.4,filter:'blur(30px)'},{opacity:1,scale:1,filter:'blur(0px)',duration:.45,ease:'expo.out'},a); cue(a,'hitA'+i);
  tl.to(s,{scale:1.06,duration:b-a-.2,ease:'none'},a+.45);
  tl.to(s,{opacity:0,filter:'blur(20px)',duration:.15,ease:'power2.in'},b-.15);});
cue(1.65,'vo:1');
tl.fromTo('#a3 .w',{opacity:0,y:40,filter:'blur(18px)'},{opacity:1,y:0,filter:'blur(0px)',duration:.5,stagger:.12},3.0); cue(3.0,'vo:2');
tl.to('#a3',{scale:1.08,duration:2.1,ease:'none'},3.0);
[4.3,4.62,4.9].forEach((g,i)=>{tl.set('#a3',{className:'glitch'},g);tl.set('#a3',{className:''},g+.06);cue(g,'glitch');});
shake('#a3',4.55,10);
tl.to('#a3',{opacity:0,scale:1.4,filter:'blur(30px)',duration:.2,ease:'power2.in'},4.98);
hide('A',5.2);

/* B: accelerating logo montage 5.2–11.0 */
show('B',5.2);
let tt=5.2, gap=.5;
for(let i=0;i<28;i++){
  tl.fromTo('#t'+i,{opacity:0,scale:1.9,rotate:(i%2?-8:8),filter:'blur(8px)'},{opacity:1,scale:1,rotate:0,filter:'blur(0px)',duration:.28,ease:'back.out(2)'},tt);
  cue(tt,'tick'+(i%4));
  tt+=gap; gap=Math.max(.085,gap*.86);
}
tl.fromTo('#wall',{scale:2.3},{scale:.92,duration:tt-5.2+.4,ease:'power2.inOut'},5.2);
tl.to('#wall',{rotate:-3,duration:5.8,ease:'none'},5.2);
cue(5.2,'riser_long');
tl.to('#scrim',{opacity:1,duration:.3},tt+.05);
tl.fromTo('#b1 .w',{opacity:0,scale:1.3,filter:'blur(20px)'},{opacity:1,scale:1,filter:'blur(0px)',duration:.35,stagger:.1},tt+.05); cue(tt+.05,'vo:3');
const bEnd=11.0;
hide('B',bEnd);

/* C: slam words on beats 11.0–12.6 */
[['C1','#c1',11.0],['C2','#c2',11.5],['C3','#c3',12.0]].forEach(([id,s,t],i)=>{
  show(id,t); tl.fromTo(s,{scale:1.6,opacity:0},{scale:1,opacity:1,duration:.18,ease:'expo.out'},t);
  tl.to(s,{scale:1.08,duration:.32,ease:'none'},t+.18); cue(t,'slam'+i); flash(t,.5); hide(id,t+.5);
});

/* D: hush 12.5–13.3 */
show('D',12.5); tl.fromTo('#d1',{opacity:0,letterSpacing:'.6em'},{opacity:1,letterSpacing:'.3em',duration:.6},12.55); cue(12.42,'vo:4'); cue(12.75,'revswell');
hide('D',13.3);

/* E: BRAAM + logo reveal 13.3–16.2 */
show('E',13.3); cue(13.3,'braam'); flash(13.3,1);
tl.fromTo('#ring2',{scale:.2,opacity:1},{scale:9,opacity:0,duration:1.1,ease:'expo.out'},13.3);
for(let i=0;i<28;i++){const a=i/28*Math.PI*2+rnd(),d=380+rnd()*520;
  tl.fromTo('#sp'+i,{x:0,y:0,opacity:1,scale:1+rnd()*2},{x:Math.cos(a)*d,y:Math.sin(a)*d,opacity:0,duration:1+rnd()*.6,ease:'expo.out'},13.3);}
tl.fromTo('#earc,#earc2',{y:300,opacity:0},{y:0,opacity:1,duration:1.4,ease:'expo.out'},13.3);
tl.fromTo('#bicon',{scale:2.6,opacity:0,filter:'blur(30px)'},{scale:1,opacity:1,filter:'blur(0px)',duration:.7,ease:'expo.out'},13.3);
shake('#brand',13.35,16);
tl.fromTo('#bdiv',{scaleY:0},{scaleY:1,duration:.4},13.6);
tl.fromTo('#wm .w',{opacity:0,x:-40,filter:'blur(16px)'},{opacity:1,x:0,filter:'blur(0px)',duration:.5,stagger:.1},13.65); cue(13.75,'vo:5');
tl.fromTo('#tg',{opacity:0,letterSpacing:'.9em'},{opacity:1,letterSpacing:'.42em',duration:.9,ease:'expo.out'},14.2);
tl.fromTo('#brand',{scale:1},{scale:1.06,duration:2.9,ease:'none'},13.3);
tl.to('#brand',{opacity:0,scale:1.25,filter:'blur(20px)',duration:.25,ease:'power2.in'},15.95); cue(15.95,'whoosh');
hide('E',16.2);

/* F: rapid #1 cards on beats 16.2–20.6 */
show('F',16.2); cue(16.25,'vo:6');
CARDS.forEach((c,k)=>{const t=16.2+k*1.1, dir=k%2?1:-1;
  tl.set('#mc'+k+',#ctag'+k,{opacity:0},0);
  tl.fromTo('#ctag'+k,{opacity:0,x:-dir*300},{opacity:1,x:dir*80,duration:1.1,ease:'none'},t);
  tl.fromTo('#mc'+k,{opacity:0,x:dir*900,rotate:dir*8,scale:.9},{opacity:1,x:0,rotate:dir*-1.5,scale:1,duration:.38,ease:'expo.out'},t);
  cue(t,'card'+k);
  const o={v:0};
  tl.to('#mr'+k,{strokeDashoffset:364.4*(1-c.score/10),duration:.55,ease:'power2.out'},t+.15);
  tl.to(o,{v:c.score,duration:.55,ease:'power2.out',onUpdate:()=>{document.getElementById('mv'+k).textContent=o.v.toFixed(1)}},t+.15);
  tl.to('#mc'+k,{scale:1.04,duration:.6,ease:'none'},t+.38);
  tl.to('#mc'+k+',#ctag'+k,{opacity:0,x:-dir*700,rotate:dir*-6,duration:.22,ease:'power2.in'},t+.88);
});
hide('F',20.6);

/* G: end card 20.6–24.2 */
show('G',20.6); cue(20.6,'endhit'); flash(20.6,.6); cue(20.75,'vo:7');
tl.fromTo('#g1 .w',{opacity:0,y:50,filter:'blur(22px)'},{opacity:1,y:0,filter:'blur(0px)',duration:.6,stagger:.07},20.65);
tl.fromTo('#g1',{scale:1.08},{scale:1,duration:3.4,ease:'power2.out'},20.6);
[0,3,1,2].forEach((i,j)=>{const t=21.3+j*.16;tl.fromTo('#pl'+i,{opacity:0,y:150,scale:.85},{opacity:1,y:0,scale:1,duration:.6,ease:'back.out(1.6)'},t);cue(t,'glass'+j);});
cue(23.0,'sting');
const END=24.2;
tl.set({}, {}, END);
window.DURATION=END; window.CUES=CUES.sort((a,b)=>a[0]-b[0]);
window.seek=s=>{tl.seek(s,false)};
window.ready=document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))));
</script></body></html>
