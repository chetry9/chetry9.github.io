const LOGOS=['chatgpt.png','lib/claude.svg','lib/google-gemini.svg','jasper.png','lib/midjourney.svg','lib/hubspot.svg','lib/salesforce.svg','lib/notion.svg','lib/clickup.svg','lib/monday.svg','lib/mailchimp.svg','lib/unbounce.svg','lib/todoist.svg','lib/grammarly.svg','lib/google-workspace.svg','lib/shopify.svg','lib/woocommerce.svg','lib/wix.svg','lib/squarespace.svg','bluehost.png','siteground.png','lib/digital-ocean.svg','hma.png','lib/slack-icon.svg','lib/asana.svg','lib/google-gmail.svg','lib/google-drive.svg','lib/evernote.svg'];
let rs=7; const rnd=()=>(rs=(rs*16807)%2147483647)/2147483647;
const POS=[];for(let r=0;r<7;r++)for(let c=0;c<4;c++)POS.push([150+c*260+(r%2)*40-20,560+r*150]);
POS.sort(()=>rnd()-.5);
document.getElementById('wall').innerHTML=LOGOS.map((l,i)=>`<div class="tile" id="t${i}" style="left:${POS[i][0]}px;top:${POS[i][1]}px"><img src="assets/logos/${l}" onerror="this.parentNode.style.display='none'"></div>`).join('');
const CATS=[['server','Web Hosting'],['shield','VPN & Security'],['spark','AI Tools'],['grid','SaaS Software'],['mail','Email Marketing'],['layout','Landing Pages'],['check','Productivity'],['cart','E-Commerce']];
document.getElementById('cats').innerHTML=CATS.map(([i,n],k)=>`<div class="ct" id="c${k}" style="left:${70+(k%2)*500}px;top:${520+Math.floor(k/2)*230}px"><div class="ci"><svg viewBox="0 0 24 24">${ICONS[i]}</svg></div><div class="cn">${n}</div></div>`).join('');
document.getElementById('parts').innerHTML=Array.from({length:30},(_,i)=>`<div class="pt" id="p${i}" style="opacity:0"></div>`).join('');
const VO=[[.05,2.64,"Over a hundred AI tools. Which ones are worth it?"],[2.85,1.96,"We review them across eight categories."],[6.5,1.77,"Discover. Compare. Choose the best."],[10.5,2.85,"BestDigiTools. Honest reviews, before you pay."]];
const CAP=document.getElementById('cap');
function caption(t){let line=null;for(const v of VO){if(t>=v[0]-.05&&t<=v[0]+v[1]+.25)line=v;}
  if(!line){CAP.innerHTML='';return;}const ws=line[2].split(' ');const tot=ws.reduce((a,w)=>a+w.length+2,0);let acc=0,html='';
  const p=(t-line[0])/line[1];ws.forEach(w=>{acc+=w.length+2;html+=`<span class="${acc/tot<=p+.02?'on':''}">${w}</span>`});CAP.innerHTML=html;}
gsap.defaults({ease:'power3.out'});
const tl=gsap.timeline({paused:true});const CUES=[];const cue=(t,y)=>CUES.push([+t.toFixed(3),y]);
const show=(id,t)=>tl.set('#'+id,{opacity:1,visibility:'visible'},t);const hide=(id,t)=>tl.set('#'+id,{opacity:0,visibility:'hidden'},t);
const flash=(t,o=.5)=>{tl.fromTo('#flash',{opacity:0},{opacity:o,duration:.04,ease:'none',immediateRender:false},t).to('#flash',{opacity:0,duration:.22},t+.04)};
const shake=(sel,t,a=18)=>{for(let i=0;i<6;i++)tl.to(sel,{x:(i%2?-1:1)*a*(1-i/6),y:(i%3-1)*a*.4,duration:.03,ease:'none'},t+i*.03);tl.to(sel,{x:0,y:0,duration:.04},t+.18)};
const slam=(sel,t,st=.06)=>tl.fromTo(sel,{opacity:0,scale:1.8,filter:'blur(16px)'},{opacity:1,scale:1,filter:'blur(0px)',duration:.2,ease:'expo.out',stagger:st},t);
const burst=(t,x,y)=>{for(let i=0;i<30;i++){const a=rnd()*Math.PI*2,d=200+rnd()*520;tl.fromTo('#p'+i,{x:x-540,y:y-900,opacity:1,scale:1+rnd()*1.5},{x:x-540+Math.cos(a)*d,y:y-900+Math.sin(a)*d,opacity:0,duration:.7+rnd()*.4,ease:'expo.out',immediateRender:false},t);}};
const whip=(from,to,t)=>{tl.to('#'+from,{x:-700,scaleX:1.25,filter:'blur(20px)',opacity:0,duration:.18,ease:'power3.in'},t-.18); hide(from,t);
  show(to,t); tl.fromTo('#'+to,{x:700,scaleX:1.25,filter:'blur(20px)'},{x:0,scaleX:1,filter:'blur(0px)',duration:.3,ease:'expo.out'},t);
  tl.fromTo('#stk',{x:0,opacity:1},{x:1700,opacity:0,duration:.35,ease:'power2.inOut',immediateRender:false},t-.15); cue(t-.18,'whip');};

/* S0 0-2.75 */
cue(0,'boom'); cue(.05,'vo:0');
tl.fromTo('#cam',{scale:1.15},{scale:1,duration:2.75,ease:'power1.out'},0);
tl.fromTo('#h0a',{scale:1.1},{scale:1,duration:.4,ease:'expo.out'},0);
const n={v:40}; tl.to(n,{v:100,duration:1.3,ease:'power2.out',onUpdate:()=>{cnt.textContent=Math.round(n.v)}},0); cue(0,'count');
let tt=0, g=.11; LOGOS.forEach((_,i)=>{tl.fromTo('#t'+i,{opacity:0,scale:2.2,rotate:(i%2?14:-14)},{opacity:1,scale:1,rotate:(i%2?4:-4),duration:.22,ease:'back.out(2)'},tt); if(i%2==0)cue(tt,'stk'+(i/2%4|0)); tt+=g; g=Math.max(.025,g*.88);});
tl.to('#wall .tile',{filter:'brightness(.35) blur(2px)',duration:.25},1.25);
slam('#h0b .w',1.3,.07); cue(1.3,'hit'); flash(1.55,.25); shake('#h0b',1.6,12);
whip('S0','S1',2.75);

/* S1 2.75-6.4 */
cue(2.85,'vo:1');
slam('#h1 .w',2.8,.08); cue(2.8,'hit2');
CATS.forEach((_,k)=>{const t=3.15+k*.14;tl.fromTo('#c'+k,{opacity:0,scale:.4,rotate:(k%2?10:-10)},{opacity:1,scale:1,rotate:0,duration:.3,ease:'back.out(2.2)'},t);cue(t,'row'+(k%4));});
tl.to('#cats .ct',{y:-14,duration:2.2,ease:'none'},4.3);
tl.to('#cats .ct .ci',{background:'rgba(253,88,20,.35)',duration:.12,stagger:.08,yoyo:true,repeat:1},5.0);
tl.to('#cam',{scale:1.07,duration:3.6,ease:'none'},2.8); tl.set('#cam',{scale:1},6.4);
whip('S1','S2',6.4);

/* S2 6.4-10.4 : three beats */
cue(6.5,'vo:2'); tl.set('#bt1,#bt2,#v0,#v1,#vsx,#sb',{opacity:0},0);
slam('#bt0 .w',6.45,0); cue(6.45,'beat0');
tl.fromTo('#sb',{opacity:0,y:60,scale:.8},{opacity:1,y:0,scale:1,duration:.3},6.6);
const q='best AI writing tool'; const qo={n:0}; tl.to(qo,{n:q.length,duration:.6,ease:'none',onUpdate:()=>{sq.textContent=q.slice(0,Math.round(qo.n))}},6.75); for(let i=0;i<6;i++)cue(6.75+i*.1,'key');
tl.to('#bt0,#sb',{opacity:0,x:-400,filter:'blur(12px)',duration:.18,ease:'power3.in'},7.55);
tl.fromTo('#bt1',{opacity:0,x:400,filter:'blur(14px)'},{opacity:1,x:0,filter:'blur(0px)',duration:.25,ease:'expo.out'},7.7); cue(7.7,'beat1');
tl.fromTo('#v0',{opacity:0,x:-400,rotate:-10},{opacity:1,x:0,rotate:-3,duration:.35,ease:'expo.out'},7.85);
tl.fromTo('#v1',{opacity:0,x:400,rotate:10},{opacity:1,x:0,rotate:3,duration:.35,ease:'expo.out'},7.95); cue(7.9,'card');
tl.fromTo('#vsx',{opacity:0,scale:2.5},{opacity:1,scale:1,duration:.2},8.15); shake('#v0,#v1',8.2,10);
tl.to('#bt1',{opacity:0,filter:'blur(12px)',duration:.15},8.85);
tl.to('#v1,#vsx',{opacity:.25,filter:'grayscale(1)',duration:.2},8.9);
tl.to('#v0',{scale:1.08,rotate:0,boxShadow:'0 0 0 4px #FD5814,0 30px 90px rgba(253,88,20,.45)',duration:.25},8.9);
tl.set('#bt2',{opacity:1},8.95); slam('#bt2 .w',8.95,.08); cue(8.95,'impact'); flash(8.95,.3);
tl.fromTo('#crn2',{opacity:0,y:-120,rotate:-30},{opacity:1,y:0,rotate:-8,duration:.35,ease:'back.out(2.5)'},9.15); burst(9.2,280,800);
whip('S2','S3',10.4);

/* S3 10.4-15.2 */
cue(10.5,'vo:3'); cue(10.4,'outro');
tl.fromTo('#lgo',{opacity:0,scale:.4,filter:'blur(24px)'},{opacity:1,scale:1,filter:'blur(0px)',duration:.55,ease:'expo.out'},10.45); cue(10.45,'impact2'); burst(10.5,540,560); flash(10.45,.35);
tl.to('#lgo img',{filter:'drop-shadow(0 0 40px rgba(253,88,20,.8))',duration:.5,yoyo:true,repeat:3},10.9);
slam('#h3 .w',11.3,.08); cue(11.3,'hit');
tl.fromTo('#follow',{opacity:0,y:60,scale:.8},{opacity:1,y:0,scale:1,duration:.45,ease:'back.out(1.8)'},12.1); cue(12.1,'pop');
tl.to('#fbtn',{scale:1.08,duration:.3,yoyo:true,repeat:3,ease:'sine.inOut'},12.6);
tl.set('#fbt',{textContent:'✓ Following'},14.0); tl.to('#fbtn',{background:'linear-gradient(180deg,#2bd46b,#16a34a)',duration:.2},14.0); cue(14.0,'fclick');
tl.to('#cam',{scale:1.05,duration:4.8,ease:'none'},10.4);
const END=15.2; tl.set({}, {}, END);
tl.eventCallback('onUpdate',()=>caption(tl.time()));
window.DURATION=END; window.CUES=CUES.sort((a,b)=>a[0]-b[0]); window.seek=s=>{tl.seek(s,false);caption(s)};
window.ready=document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))));
</script></body></html>
