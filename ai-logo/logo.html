    st.sparkS = t >= 2.2 ? lerp(.5, 1, kp) : 0; st.sparkDX = 430 * (1 - kp); st.sparkDY = -400 * (1 - kp);
    st.sparkRot = lerp(-220, 0, kp);
    st.flare = bump(t, 2.72, .3);
    st.eyeA = t > 2.9 ? 1 : 0; st.eyeScan = prog(t, 2.9, 3.35); st.eyeGlow = bump(t, 3.35, .25);
    st.winkL = bump(t, 3.95, .2);
    st.eyeOpen = blinks(t, [5.0]);
    [st.lookX, st.lookY] = look(t, [[0, 0, 0], [4.3, 0, 0], [4.55, -9, -4], [4.8, -9, -4], [5.15, 0, 0]]);
    st.shine = prog(t, 4.2, 5.0);
    idle(st, t, 2.4);
    return st;
  },
  // 5 — Gyroscope 3D: tile flips in, rings unfold in 3D, sphere drops & squashes, eyes pop
  5(t) {
    const st = baseState();
    const fp = prog(t, 0, .7);
    st.groupSX = Math.max(.001, backOut(fp, 1.3)); st.tileA = clamp(fp * 4);
    st.groupS = lerp(1.07, 1, easeOut(prog(t, 0, 5.5)));
    // drop, land at 0.85, spring settle
    const d = prog(t, .25, .85);
    st.sphS = t >= .25 ? 1 : 0;
    st.sphY = t < .85 ? lerp(-760, 0, d * d) : 0;
    const L = t - .85;
    if (t < .85) { st.sphSX = lerp(1, .9, d); st.sphSY = lerp(1, 1.12, d); }
    else { const sq = Math.exp(-L * 6) * Math.cos(L * 22); st.sphSX = 1 + .24 * sq; st.sphSY = 1 - .22 * sq; }
    st.pulse = prog(t, .85, 1.7);
    st.rimRot = lerp(-180, 0, easeOut(prog(t, .8, 2.6)));
    const r0 = easeOut(prog(t, .75, 2.3)), r1 = easeOut(prog(t, .9, 2.45));
    st.ringBF = [lerp(.03, 1, r0), lerp(.03, 1, r1)];
    st.ringSpin = [lerp(-95, 0, r0), lerp(95, 0, r1)];
    st.ringPhase = [lerp(-260, 0, r0), lerp(260, 0, r1)];
    st.ringA = clamp(prog(t, .75, .95));
    const kp = prog(t, 2.05, 2.65);
    st.sparkS = kp > 0 ? backOut(kp, 2.6) : 0; st.sparkRot = lerp(-540, 0, easeOut(kp));
    st.flare = bump(t, 2.5, .28) * .8;
    const eo = prog(t, 2.45, 2.75);
    st.eyeA = eo > 0 ? 1 : 0;
    st.eyeOpen = (eo < 1 ? backOut(eo, 3) : 1) * blinks(t, [3.35, 4.85, 5.08]);
    st.eyeGlow = bump(t, 2.65, .25);
    [st.lookX, st.lookY] = look(t, [[0, 0, 0], [3.6, 0, 0], [3.85, 10, -8], [4.35, 10, -8], [4.6, 0, 0]]);
    st.shine = prog(t, 3.9, 4.7);
    idle(st, t, 2.6);
    return st;
  },
  // 6 — AI Glitch Boot: neural net collapses into the core, logo resolves from pixels with glitches, cursor splits into eyes
  6(t) {
    const st = baseState();
    st.tileA = easeOut(prog(t, 0, .35));
    st.net = clamp(prog(t, .1, 1.1)); st.converge = prog(t, 1.15, 1.55);
    if (t >= 1.6) st.net = 0;
    const on = t >= 1.5;
    st.sphS = on ? 1 : 0; st.ringA = on ? 1 : 0; st.sparkS = on ? 1 : 0;
    st.flash = bump(t, 1.55, .18);
    st.pulse = prog(t, 1.5, 2.4);
    const steps = [64, 40, 28, 18, 12, 8, 5, 3, 2, 1];
    st.pixel = on ? steps[Math.min(steps.length - 1, Math.floor(prog(t, 1.5, 2.55) * steps.length))] : 1;
    st.glitch = Math.max(bump(t, 1.62, .1), bump(t, 1.95, .08) * .8, bump(t, 2.35, .07) * .7, bump(t, 3.9, .06) * .5);
    st.rimRot = lerp(-200, 0, easeOut(prog(t, 1.5, 3.2)));
    // typing cursor, then it splits into two eyes
    st.eyeA = t >= 2.65 ? ((t < 3.3 && Math.floor((t - 2.65) / .2) % 2 === 1) ? 0 : 1) : 0;
    st.eyeSplit = easeOut(prog(t, 3.3, 3.6));
    st.eyeOpen = (t < 3.3 ? .22 : lerp(.22, 1, backOut(prog(t, 3.3, 3.6), 2.2))) * blinks(t, [4.4]);
    st.eyeGlow = bump(t, 3.55, .25);
    [st.lookX, st.lookY] = look(t, [[0, 0, 0], [4.6, 0, 0], [4.8, 9, 0], [5.05, 9, 0], [5.25, 0, 0]]);
    st.sparkFlash = bump(t, 2.6, .25) * .7;
    st.shine = prog(t, 4.1, 4.9);
    idle(st, t, 2.6);
    return st;
  },
};

// ---------- render ----------
let offA = null, offB = null;
const canvas2 = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function drawScene(st, t, s, w, h) {
  st.k = s;
  ctx.setTransform(s, 0, 0, s, w / 2 - 627 * s, h / 2 - 624 * s);
  ctx.translate(627, 624); ctx.scale(st.groupS * st.groupSX, st.groupS); ctx.translate(-627, -624);
  ctx.save();
  if (st.iris < 1) { ctx.beginPath(); ctx.arc(SPHERE.x, SPHERE.y, irisR(st), 0, TAU); ctx.clip(); }
  drawTile(st);
  ctx.save();
  // keep artwork inside the tile so nothing (glow, rings) spills onto the transparent area
  const cx = BOX.x + BOX.w / 2, cy = BOX.y + BOX.h / 2;
  ctx.translate(cx, cy); ctx.scale(st.tileS, st.tileS); ctx.translate(-cx, -cy);
  roundRect(BOX.x, BOX.y, BOX.w, BOX.h, BOX.r); ctx.clip();
  ctx.translate(cx, cy); ctx.scale(1 / st.tileS, 1 / st.tileS); ctx.translate(-cx, -cy);
  drawNet(st, t);
  drawParticles(st);
  drawRings(st, false);
  drawSphere(st);
  drawPulse(st);
  drawRings(st, true);
  drawComets(st);
  drawSpark(st);
  drawGlints(st);
  drawIrisEdge(st);
  ctx.restore();
  ctx.restore();
}
function render(t) {
  const st = TIMELINES[VARIANT](t);
  const s = Math.min(W, H) / 1254 * +(params.get('fit') || .94);
  mainCtx.setTransform(1, 0, 0, 1, 0, 0);
  mainCtx.clearRect(0, 0, W, H);
  if (st.pixel > 1) {
    // resolve-from-pixels: draw small, then scale up without smoothing
    const pw = Math.ceil(W / st.pixel), ph = Math.ceil(H / st.pixel);
    if (!offA || offA.width !== pw || offA.height !== ph) offA = canvas2(pw, ph);
    ctx = offA.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, pw, ph);
    drawScene(st, t, s / st.pixel, pw, ph);
    ctx = mainCtx;
    mainCtx.imageSmoothingEnabled = false;
    mainCtx.drawImage(offA, 0, 0, pw * st.pixel, ph * st.pixel);
    mainCtx.imageSmoothingEnabled = true;
  } else {
    drawScene(st, t, s, W, H);
  }
  if (st.glitch > .02) {
    // slice displacement + RGB split
    if (!offB) offB = canvas2(W, H);
    const b = offB.getContext('2d');
    b.setTransform(1, 0, 0, 1, 0, 0); b.clearRect(0, 0, W, H); b.drawImage(cv, 0, 0);
    mainCtx.setTransform(1, 0, 0, 1, 0, 0); mainCtx.clearRect(0, 0, W, H);
    let gs = 1 + Math.floor(t * 24) * 97; const gr = () => (gs = (gs * 16807) % 2147483647) / 2147483647;
    const d = 14 * st.glitch * W / 1080;
    mainCtx.filter = `drop-shadow(${-d}px 0 0 rgba(0,255,255,.75)) drop-shadow(${d}px 0 0 rgba(255,0,170,.75))`;
    for (let y = 0; y < H;) {
      const hh = Math.max(4, Math.round(gr() * H * .09)), dx = gr() < .45 ? (gr() - .5) * W * .12 * st.glitch : 0;
      mainCtx.drawImage(offB, 0, y, W, hh, dx, y, W, hh);
      y += hh;
    }
    mainCtx.filter = 'none';
  }
}

window.DURATION = DURATION;
window.renderAt = render;
render(0); window.ready = true;
if (!params.has('capture')) { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % (DURATION + .8)); requestAnimationFrame(loop); }; loop(); }
</script>
